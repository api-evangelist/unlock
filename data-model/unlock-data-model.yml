  stories, faq, lessons, topics) and two of those — faq and testimonials — are deliberately
  registered into the first-party `unlock/v1` namespace rather than `wp/v2`. The remaining types
  are WordPress site-building furniture (templates, patterns, fonts, global styles) and are listed
  for completeness but are not part of the readable content surface.
