    declared: false
    evidence: >-
      No MISMO namespace, message type or schema reference appears in either contract or anywhere
      on the public site. Unlock's public surface is content, not loan data, so there is nothing
      for a mortgage data standard to attach to.
  - id: fdx
    name: Financial Data Exchange (FDX) API
    declared: false
    evidence: No FDX endpoint, scope or schema is exposed or referenced.
  - id: iso20022
    name: ISO 20022
    declared: false
    evidence: No payment or messaging surface is exposed.
  finding: >-
    No domain standard is declared, and none is expected: the only public contract is a content API.
    This is a reward-only dimension, so its absence is recorded rather than penalised.
