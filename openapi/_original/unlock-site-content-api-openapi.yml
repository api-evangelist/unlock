              type: integer
      required:
      - code
      - message
  securitySchemes:
    applicationPassword:
      type: http
      scheme: basic
      description: WordPress application password (HTTP Basic). Advertised by this deployment at https://www.unlock.com/wp/wp-admin/authorize-application.php
        in the `authentication` block of the route index. It gates the write methods on these routes; every operation documented
        here is anonymous read and requires no credential.
