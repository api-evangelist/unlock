aid: unlock
name: Unlock
description: >-
  Unlock Technologies, Inc. is a Tempe, Arizona fintech founded in 2020 by Jim Riccitelli, Dan Foster
  and Ryan Craft, with a branch office in Troy, Michigan. Its flagship product is the home equity
  agreement (HEA) — a homeowner receives a lump sum today, from $15,000 up to $500,000, in exchange
  for a share of the home's future value, with no monthly payments and no interest, settled when the
  home is sold or refinanced or at the end of the ten-year term. Unlock charges an origination fee of
  up to 4.9% of the amount advanced, takes a share of the property capped at 49.9%, and caps its own
  return at 19.9% per year. The company is licensed in 26 US states and has raised roughly $52.6M in
  equity; its Series B included a $30M equity investment from D2 Asset Management, with Saluda Grade,
  Second Century Ventures and REACH also participating. Unlock sells to homeowners, not to developers: it publishes no
  developer program, no API reference, no SDKs, no key issuance and no partner API. The only
  machine-readable interfaces it exposes are the first-party WordPress REST namespaces behind
  www.unlock.com — `unlock/v1`, `unlock/v2` and `unlk/v1`, custom endpoints written for Unlock rather
  than WordPress core routes — plus the core `wp/v2` editorial content API. Both are captured here
  for discovery, are anonymously readable, and are read-only without credentials.
url: https://raw.githubusercontent.com/api-evangelist/unlock/refs/heads/main/apis.yml
