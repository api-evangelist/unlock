apis:
- aid: unlock:unlock-site-content-api
  name: Unlock Site Content API
  description: >-
    The first-party REST namespaces Unlock registers on www.unlock.com — `unlock/v1`, `unlock/v2` and
    `unlk/v1`. These are custom endpoints written for Unlock, not WordPress core routes, and they
    serve the company blurb and Tempe address, the 26 active states where the HEA is offered, legal
    disclaimers and footer disclosures, social profiles, logo assets, navigation menus by location,
    145 FAQ entries and their categories, 8 homeowner testimonials, and the Unlock Learn curriculum.
    Anonymous access is read-only and needs no credential; the write methods the route index also
    advertises require a WordPress application password.
  humanURL: https://www.unlock.com/wp-json/unlock/v1
