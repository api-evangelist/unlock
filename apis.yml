- aid: unlock:unlock-editorial-api
  name: Unlock Editorial API
  description: >-
    Anonymous read access to the Unlock editorial archive through the WordPress core `wp/v2`
    namespace — 251 blog posts, 24 pages, 778 media items, 9 Learn articles, 13 homeowner stories,
    6 education topics, 1 lesson and 11 bylined authors, plus the categories, tags and
    education-category taxonomies, cross-type search, and the self-describing type and status
    metadata. Read-only without credentials.
  humanURL: https://www.unlock.com/wp-json/wp/v2
