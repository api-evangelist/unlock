  Unlock runs no developer program, so it publishes no versioning policy, no deprecation policy, no
  Sunset/Deprecation header commitment, no SLA and no working status page. Nothing below is inferred
  from marketing copy — each row is either something the surface itself exposes or a probe that missed.
